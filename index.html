<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnnoyOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="desktop">

    <div class="window">

        <div class="window-top">
            AnnoyOS v1.0
        </div>

        <div class="window-body">

            <h1>🤪 Welcome to AnnoyOS</h1>

            <p>
                The operating system nobody asked for.
            </p>

            <button id="startBtn">
                Start AnnoyOS
            </button>

        </div>

    </div>

</div>

<div class="taskbar">

    <button class="start">
        🍕 Start
    </button>

    <div class="clock">
        04:20 PM
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
