
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnnoyOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="desktop">

    <div class="window">

        <div class="window-top">
            AnnoyOS v1.0
        </div>

        <div class="window-body">

            <h1>🤪 Welcome to AnnoyOS</h1>

            <p>
                The operating system nobody asked for.
            </p>

            <button id="startBtn">
                Start AnnoyOS
            </button>

            <p id="status">
                Attempts to click: 0
            </p>

            <p id="message">
                Try clicking the button 😏
            </p>

            <div id="rageWrap">

                <div id="rageBar">
                    <div id="rageFill"></div>
                </div>

                <p id="rageText">
                    Rage Level: 0%
                </p>

            </div>

            <button id="scanBtn">
                🛡 Scan Computer
            </button>

        </div>

    </div>

</div>

<div class="taskbar">

    <button class="start">
        🍕 Start
    </button>

    <div class="clock">
        04:20 PM
    </div>

</div>

<div id="errorBox">

    <div id="errorTitle">
        ⚠ System Error
    </div>

    <p id="errorText">
        Something broke.
    </p>

    <button id="closeError">
        Close
    </button>

</div>

<div id="scanBox">

    <div id="scanTitle">
        🛡 AnnoyOS Security Scanner
    </div>

    <div id="progressBar">
        <div id="progressFill"></div>
    </div>

    <p id="scanStatus">
        Ready to scan.
    </p>

    <button id="closeScan">
        Close
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
